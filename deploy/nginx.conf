# remit-ai.app served by nginx from the built site. Clean URLs (/pricing/ → pricing/index.html),
# the same security headers public/_headers declares for Cloudflare Pages, long-lived caching
# for the hashed assets, and www → apex. Put the built `dist/` at /var/www/remit-ai.app.
#
# TLS is left to your usual certbot/ACME setup; the http → https redirect is included.

server {
    listen 80;
    listen [::]:80;
    server_name remit-ai.app www.remit-ai.app;
    return 301 https://remit-ai.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.remit-ai.app;
    ssl_certificate     /etc/letsencrypt/live/remit-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remit-ai.app/privkey.pem;
    return 301 https://remit-ai.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remit-ai.app;

    ssl_certificate     /etc/letsencrypt/live/remit-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remit-ai.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/remit-ai.app;
    index index.html;
    charset utf-8;

    # The site loads nothing from anyone else; the policy says so. connect-src allows the
    # download buttons to ask api.remit-ai.app for the current installers. 'wasm-unsafe-eval'
    # is for Pagefind, the search index, which runs in WebAssembly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.remit-ai.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # Hashed build assets never change under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location = /_headers { return 404; }
    location = /_redirects { return 404; }

    # Clean URLs: /pricing/ and /pricing both serve pricing/index.html; the manual the same.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;
}
